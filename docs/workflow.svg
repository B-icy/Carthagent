<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 3660 460" width="3660" height="460" preserveAspectRatio="xMinYMin meet">
  <defs>
    <style type="text/css"><![CDATA[
      .node-text-bold { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #0A0F25; }
      .node-text-sub { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500; font-size: 13.5px; fill: #4B5563; }
      .edge-label { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-style: italic; font-size: 14px; fill: #475569; }
      .edge-label-success { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 13.5px; fill: #047857; }
      .edge-label-critique { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 13.5px; fill: #6366F1; }
      .arrow { stroke: #0D32B2; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-critique { stroke: #4F46E5; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4,3; }
      .arrow-success { stroke: #059669; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-repair { stroke: #D97706; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    ]]></style>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1.5 8,5 0,8.5" fill="#0D32B2" />
    </marker>
    <marker id="arrowhead-critique" markerWidth="10" markerHeight="10" refX="8" refY="5" viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1.5 8,5 0,8.5" fill="#4F46E5" />
    </marker>
    <marker id="arrowhead-success" markerWidth="10" markerHeight="10" refX="8" refY="5" viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1.5 8,5 0,8.5" fill="#059669" />
    </marker>
    <marker id="arrowhead-repair" markerWidth="10" markerHeight="10" refX="8" refY="5" viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1.5 8,5 0,8.5" fill="#D97706" />
    </marker>
  </defs>

  <rect x="0" y="0" width="3660" height="460" fill="#FFFFFF" rx="8" />

  <!-- 1. INSPECT NODE -->
  <g id="node-inspect">
    <rect x="20" y="175" width="270" height="70" rx="8" stroke="#0D32B2" stroke-width="2" fill="#F7F8FE" />
    <text x="155" y="216" text-anchor="middle" class="node-text-bold">Inspect repository + installed APIs</text>
  </g>

  <!-- inspect -> contract -->
  <path d="M 290 210 L 350 210" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 2. CONTRACT DRAFT NODE -->
  <g id="node-contract">
    <rect x="350" y="167" width="270" height="86" rx="8" stroke="#0D32B2" stroke-width="2" fill="#F7F8FE" />
    <text x="485" y="205" text-anchor="middle" class="node-text-bold">Acceptance contract draft</text>
    <text x="485" y="228" text-anchor="middle" class="node-text-sub">Scope, risks, concrete checks</text>
  </g>

  <!-- contract -> review_plan -->
  <path d="M 620 210 L 685 210" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 3. REVIEW_PLAN (CRITIQUE LOOP) NODE -->
  <g id="node-review_plan">
    <rect x="690" y="156" width="340" height="106" rx="10" stroke="#4F46E5" stroke-width="2.5" fill="#EEF2FF" />
    <rect x="702" y="166" width="94" height="20" rx="10" fill="#E0E7FF" />
    <text x="749" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#4338CA">CRITIQUE LOOP</text>
    <text x="860" y="205" text-anchor="middle" class="node-text-bold" fill="#1E1B4B">Plan &amp; architecture critique loop</text>
    <text x="860" y="227" text-anchor="middle" class="node-text-sub" fill="#3730A3">Confidence &#x2265; 8/10 &amp; failure modes</text>
    <text x="860" y="247" text-anchor="middle" class="node-text-sub" fill="#4338CA">Bounded iterations (&#x2265; 2 rounds)</text>
  </g>

  <!-- review_plan -> review_plan SELF LOOP (Low confidence / unhandled risks) -->
  <path d="M 770 156 C 770 95, 950 95, 950 152" class="arrow-critique" marker-end="url(#arrowhead-critique)" />
  <rect x="745" y="70" width="230" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <text x="860" y="85" text-anchor="middle" class="edge-label-critique">Low confidence / unhandled risks</text>

  <!-- review_plan -> plan (High confidence & approved) -->
  <path d="M 1030 210 L 1315 210" class="arrow-success" marker-end="url(#arrowhead-success)" />
  <rect x="1055" y="196" width="235" height="24" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
  <text x="1172" y="213" text-anchor="middle" class="edge-label-success">High confidence (&#x2265; 8/10) &amp; approved</text>

  <!-- 4. PLAN (LOCKED) NODE -->
  <g id="node-plan">
    <rect x="1320" y="167" width="250" height="86" rx="8" stroke="#0D32B2" stroke-width="2" fill="#F7F8FE" />
    <text x="1445" y="205" text-anchor="middle" class="node-text-bold">D2 implementation plan (locked)</text>
    <text x="1445" y="228" text-anchor="middle" class="node-text-sub">Frozen scope, bound checks</text>
  </g>

  <!-- plan -> slice -->
  <path d="M 1570 210 L 1635 210" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 5. RUNNABLE VERTICAL SLICE NODE -->
  <g id="node-slice">
    <rect x="1640" y="167" width="280" height="86" rx="8" stroke="#0D32B2" stroke-width="2" fill="#F7F8FE" />
    <text x="1780" y="205" text-anchor="middle" class="node-text-bold">Runnable vertical slice</text>
    <text x="1780" y="228" text-anchor="middle" class="node-text-sub">Rendering verified first for games</text>
  </g>

  <!-- slice -> build -->
  <path d="M 1920 210 L 1985 210" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 6. IMPLEMENT FEATURES NODE -->
  <g id="node-build">
    <rect x="1990" y="175" width="290" height="70" rx="8" stroke="#0D32B2" stroke-width="2" fill="#F7F8FE" />
    <text x="2135" y="216" text-anchor="middle" class="node-text-bold">Implement features + regression tests</text>
  </g>

  <!-- build -> verify -->
  <path d="M 2280 210 L 2345 210" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 7. VERIFY CHECKS NODE -->
  <g id="node-verify">
    <rect x="2350" y="167" width="310" height="86" rx="8" stroke="#0D32B2" stroke-width="2" fill="#F7F8FE" />
    <text x="2505" y="205" text-anchor="middle" class="node-text-bold">Run checks against fingerprint</text>
    <text x="2505" y="228" text-anchor="middle" class="node-text-sub">Record exit status + output tail</text>
  </g>

  <!-- 8. ADVERSARIAL REVIEW NODE -->
  <g id="node-review">
    <rect x="2770" y="30" width="290" height="84" rx="8" stroke="#0D32B2" stroke-width="2" fill="#F7F8FE" />
    <text x="2915" y="68" text-anchor="middle" class="node-text-bold">Adversarial review</text>
    <text x="2915" y="91" text-anchor="middle" class="node-text-sub">UX, edge cases, limitations</text>
  </g>

  <!-- verify -> review -->
  <path d="M 2550 167 C 2630 100, 2700 72, 2765 72" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 9. REPAIR FAILURES NODE -->
  <g id="node-repair">
    <rect x="3230" y="167" width="290" height="86" rx="8" stroke="#D97706" stroke-width="2" fill="#FFFBEB" />
    <text x="3375" y="205" text-anchor="middle" class="node-text-bold" fill="#92400E">Repair failures (bounded)</text>
    <text x="3375" y="228" text-anchor="middle" class="node-text-sub" fill="#B45309">Failing check + quoted output tail</text>
  </g>

  <!-- 10. DELIVER NODE -->
  <g id="node-deliver">
    <rect x="3230" y="30" width="280" height="84" rx="8" stroke="#059669" stroke-width="2" fill="#ECFDF5" />
    <text x="3370" y="68" text-anchor="middle" class="node-text-bold" fill="#065F46">Evidence + launch instructions</text>
    <text x="3370" y="91" text-anchor="middle" class="node-text-sub" fill="#047857">Explicit limitations</text>
  </g>

  <!-- review -> deliver -->
  <path d="M 3060 72 L 3225 72" class="arrow-success" marker-end="url(#arrowhead-success)" />

  <!-- verify -> repair (failed / stale) -->
  <path d="M 2660 210 L 3225 210" class="arrow-repair" marker-end="url(#arrowhead-repair)" />
  <rect x="2860" y="198" width="110" height="22" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
  <text x="2915" y="214" text-anchor="middle" class="edge-label" fill="#B45309">failed / stale</text>

  <!-- review -> repair (defect) -->
  <path d="M 3060 92 C 3140 120, 3180 150, 3225 180" class="arrow-repair" marker-end="url(#arrowhead-repair)" />
  <rect x="3130" y="118" width="60" height="20" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
  <text x="3160" y="132" text-anchor="middle" class="edge-label" fill="#B45309">defect</text>

  <!-- repair -> verify (feedback loop) -->
  <path d="M 3375 253 C 3375 350, 2505 350, 2505 258" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="2880" y="338" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="2940" y="353" text-anchor="middle" class="edge-label">repair &#x2192; verify</text>

</svg>
