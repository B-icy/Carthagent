name: Feature request
description: Suggest a change or new capability
labels: [enhancement, 'status: triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should ctg do? Include example commands or screens if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI / headless, Native TUI, Ship / delivery checks, Cloud, Voyages, Install or update, Web dashboard, Docs, Other]
