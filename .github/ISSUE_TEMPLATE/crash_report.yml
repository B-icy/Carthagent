name: Crash report
description: ctg exited with an unexpected error. `ctg doctor` prefills this form from your local crash report.
labels: [bug, 'source: crash-report', 'status: triage']
body:
  - type: markdown
    attributes:
      value: |
        Crash reports are stored only on your machine under `~/.carthagent/logs/`. They are redacted, but please read
        the report before pasting it and remove anything you do not want to share.
  - type: input
    id: fingerprint
    attributes:
      label: Crash fingerprint
      description: The short id printed by `ctg doctor` (used to group duplicate crashes).
  - type: input
    id: version
    attributes:
      label: ctg version and platform
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The subcommand and flags you ran (no prompt text needed).
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Crash report
      description: Error, stack trace and recent events from the report file.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What were you doing?
