name: CI alert

on:
  workflow_run:
    workflows:
      - CI
      - Release
      - Accept draft runtime release
      - Build or publish CTG-owned OpenCode runtime
      - Sync labels
    types: [completed]

permissions:
  contents: read

# One alert job per watched workflow at a time so two quick failures cannot
# open duplicate issues.
concurrency:
  group: ci-alert-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  alert:
    # Pull request runs (including forks) never alert; the script re-checks
    # the same rules before writing anything.
    if: >-
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.event != 'pull_request_target' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'workflow_dispatch' ||
       github.event.workflow_run.head_branch == github.event.repository.default_branch) &&
      contains(fromJSON('["failure", "timed_out", "startup_failure", "success"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      # workflow_run always checks out the default branch, never the
      # triggering run's code.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Open, update or close the CI alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci-alert.mjs --event "$GITHUB_EVENT_PATH"
