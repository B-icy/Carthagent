name: Release notes draft

# Drafts Markdown release notes from merged pull requests for a human to edit.
# It never edits a release: the notes go to the job summary and an artifact.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to describe, for example v1.1.3
        required: true
        type: string
      previous_tag:
        description: Earlier tag to compare from (default is the previous semver tag)
        required: false
        type: string
        default: ''
  release:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-notes-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  draft-notes:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          out="release-notes-${TAG#v}.md"
          args=(--tag "$TAG" --repo "$GITHUB_REPOSITORY" --out "$out")
          if [ -n "$PREVIOUS_TAG" ]; then
            args+=(--previous "$PREVIOUS_TAG")
          fi
          # A draft release may name a tag that is created only on publish.
          if [ -n "$TARGET" ] && ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            args+=(--ref "$TARGET")
          fi
          node tools/release-notes.mjs "${args[@]}"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          echo "file=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ inputs.tag || github.event.release.tag_name }}
          path: ${{ steps.notes.outputs.file }}
          if-no-files-found: error
