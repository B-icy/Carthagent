name: Build or publish CTG-owned OpenCode runtime

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a reviewable prebuild candidate, or publish a previously completed candidate unchanged
        required: true
        type: choice
        options: [prebuild, publish]
      release_version:
        description: Planned package release version without a v prefix
        required: true
        type: string
      source_commit:
        description: Exact reviewed prebuild source SHA (must equal this dispatch's commit)
        required: false
        type: string
      prebuild_run_id:
        description: Successful prebuild workflow run ID (publish mode)
        required: false
        type: string
      release_tag:
        description: Existing draft tag v<release_version> (publish mode)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ctg-owned-runtime-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    # gh release view for an existing draft requires contents:write. Keep this
    # capability on the validation job only; prebuild jobs stay read-only, and
    # actual release uploads remain isolated to publish-existing-draft.
    permissions:
      actions: read
      contents: write
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      release_version: ${{ steps.validate.outputs.release_version }}
      source_commit: ${{ steps.validate.outputs.source_commit }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
      release_commit: ${{ steps.validate.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate planned version and selected source/release
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PREBUILD_RUN_ID: ${{ inputs.prebuild_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          if [[ "$MODE" == prebuild ]]; then
            [[ "$GITHUB_REF" == refs/heads/* ]]
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]
            gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_COMMIT" --jq '.sha' | grep -qx "$SOURCE_COMMIT"
            echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          elif [[ "$MODE" == publish ]]; then
            [[ "$PREBUILD_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]]
            prebuild_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREBUILD_RUN_ID")"
            default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
            [[ "$GITHUB_REF" == "refs/heads/$default_branch" ]]
            [[ "$(jq -r .status <<<"$prebuild_run")" == completed ]]
            [[ "$(jq -r .conclusion <<<"$prebuild_run")" == success ]]
            [[ "$(jq -r .event <<<"$prebuild_run")" == workflow_dispatch ]]
            [[ "$(jq -r .head_repository.full_name <<<"$prebuild_run")" == "$GITHUB_REPOSITORY" ]]
            workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-owned-opencode-runtime.yml" --jq '.id')"
            [[ "$(jq -r .workflow_id <<<"$prebuild_run")" == "$workflow_id" ]]
            prebuild_branch="$(jq -r .head_branch <<<"$prebuild_run")"
            prebuild_sha="$(jq -r .head_sha <<<"$prebuild_run")"
            [[ "$prebuild_branch" =~ ^[A-Za-z0-9._/-]+$ ]]
            [[ "$prebuild_sha" =~ ^[0-9a-f]{40}$ ]]
            echo "source_commit=$prebuild_sha" >> "$GITHUB_OUTPUT"
            tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')"
            if [[ "$tag_type" == tag ]]; then tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_commit" --jq '.object.sha')"; fi
            [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]]
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == true' | grep -qx true
            echo "release_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported mode: $MODE" >&2
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$MODE" == publish ]]; then echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"; fi

  prebuild:
    if: needs.validate-request.outputs.mode == 'prebuild'
    needs: validate-request
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            key: linux-x64
            target: opencode-linux-x64
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            key: linux-arm64
            target: opencode-linux-arm64
            platform: linux
            arch: arm64
          - os: macos-15-intel
            key: darwin-x64
            target: opencode-darwin-x64
            platform: darwin
            arch: x64
          - os: macos-15
            key: darwin-arm64
            target: opencode-darwin-arm64
            platform: darwin
            arch: arm64
          - os: windows-latest
            key: windows-x64
            target: opencode-windows-x64
            platform: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ctg
          ref: ${{ needs.validate-request.outputs.source_commit }}
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: 843a6c514e606b436a7fe713422ace0a93ad3d61
          path: opencode
        env:
          # actions/checkout has no generic `config` input. Supply Git's supported
          # config environment before its internal checkout materializes files.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/checkout@v4
        with:
          repository: B-icy/Carthagent
          ref: e32bcf7d00645222a34be002f9f7da6626d8db9c
          path: release-generator
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build pinned native runtime
        shell: bash
        run: |
          set -euo pipefail
          # Persist the same checkout interpretation for the recipe's later
          # git status checks in this isolated upstream clone.
          git -C opencode config --local core.autocrlf false
          mkdir -p opencode/docs/patches opencode/script/ctg
          git -C ctg show HEAD:docs/patches/opencode-v2.0.32-session-ui-combined-v3.patch > opencode/docs/patches/opencode-v2.0.32-session-ui-combined-v3.patch
          git -C ctg show HEAD:script/ctg/build-owned-runtime.sh > opencode/script/ctg/build-owned-runtime.sh
          chmod +x opencode/script/ctg/build-owned-runtime.sh
          cd opencode
          script/ctg/build-owned-runtime.sh "${{ matrix.target }}"
      - name: Archive runtime bytes and write native build record
        shell: bash
        env:
          TARGET_KEY: ${{ matrix.key }}
          TARGET: ${{ matrix.target }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ needs.validate-request.outputs.source_commit }}
          OUT: ${{ github.workspace }}/candidate-assets
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          artifact="${TARGET#opencode-}"
          binary="opencode/packages/cli/dist-ctg/cli-${artifact}/bin/opencode"
          [[ "$TARGET_PLATFORM" != windows ]] || binary="opencode/packages/cli/dist-ctg/cli-${artifact}/bin/opencode.exe"
          test -f "$binary"
          if command -v sha256sum >/dev/null 2>&1; then hash_file() { sha256sum "$1" | awk '{print $1}'; }; else hash_file() { shasum -a 256 "$1" | awk '{print $1}'; }; fi
          archive="candidate-assets/opencode-${TARGET_KEY}.tar.gz"
          COPYFILE_DISABLE=1 tar -C opencode/packages/cli/dist-ctg --format=ustar -czf "$archive" .
          archive_sha256="$(hash_file "$archive")"
          executable_sha256="$(hash_file "$binary")"
          # Hash the exact committed blob extracted into the upstream checkout,
          # not a potentially CRLF-converted Windows CTG worktree file.
          patch_sha256="$(hash_file opencode/docs/patches/opencode-v2.0.32-session-ui-combined-v3.patch)"
          lock_sha256="$(hash_file opencode/bun.lock)"
          TARGET_KEY="$TARGET_KEY" TARGET_PLATFORM="$TARGET_PLATFORM" TARGET_ARCH="$TARGET_ARCH" SOURCE_REVISION="$(git -C opencode rev-parse HEAD)" PATCH_SHA256="$patch_sha256" LOCK_SHA256="$lock_sha256" ARCHIVE_SHA256="$archive_sha256" EXECUTABLE_SHA256="$executable_sha256" OUT="$OUT" \
            node -e 'const fs=require("node:fs"); const record={version:1,target:process.env.TARGET_KEY,platform:process.env.TARGET_PLATFORM,arch:process.env.TARGET_ARCH,sourceRevision:process.env.SOURCE_REVISION,patchSha256:process.env.PATCH_SHA256,lockSha256:process.env.LOCK_SHA256,compatibilityVersion:"2.0.32",runtimeVersion:"0.0.0-ctg.2.0.32",archiveSha256:process.env.ARCHIVE_SHA256,executableSha256:process.env.EXECUTABLE_SHA256}; fs.writeFileSync(process.env.OUT+"/opencode-"+process.env.TARGET_KEY+".tar.gz.build.json",JSON.stringify(record,null,2)+"\n",{flag:"wx"})'
          test "$(git -C opencode rev-parse HEAD)" = 843a6c514e606b436a7fe713422ace0a93ad3d61
          test "$SOURCE_COMMIT" = "${{ needs.validate-request.outputs.source_commit }}"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$archive" "$OUT/opencode-${TARGET_KEY}.tar.gz.build.json" >> "$GITHUB_STEP_SUMMARY"; else shasum -a 256 "$archive" "$OUT/opencode-${TARGET_KEY}.tar.gz.build.json" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ctg-runtime-prebuild-${{ matrix.key }}
          path: |
            candidate-assets/opencode-${{ matrix.key }}.tar.gz
            candidate-assets/opencode-${{ matrix.key }}.tar.gz.build.json
          if-no-files-found: error
          retention-days: 90

  assemble-candidate:
    if: needs.validate-request.outputs.mode == 'prebuild'
    needs: [validate-request, prebuild]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-request.outputs.source_commit }}
          path: ctg
      - uses: actions/checkout@v4
        with:
          repository: B-icy/Carthagent
          ref: e32bcf7d00645222a34be002f9f7da6626d8db9c
          path: release-generator
      - name: Verify pinned release generator is present
        shell: bash
        run: |
          test "$(git -C release-generator rev-parse HEAD)" = e32bcf7d00645222a34be002f9f7da6626d8db9c
          test -f release-generator/tools/generate-owned-runtime-release.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: ctg-runtime-prebuild-*
          path: native-build-records
          merge-multiple: true
      - name: Validate five native outputs and generate candidate manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-request.outputs.release_version }}
          SOURCE_COMMIT: ${{ needs.validate-request.outputs.source_commit }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            archive="opencode-$key.tar.gz"
            test -f "native-build-records/$archive"
            test -f "native-build-records/$archive.build.json"
          done
          mkdir candidate-assets
          cp native-build-records/opencode-*.tar.gz native-build-records/opencode-*.tar.gz.build.json candidate-assets/
          # The pinned release generator still reads the historical patch path.
          # In this isolated checkout, provide the reviewed candidate bytes at
          # that compatibility path without changing the source repository.
          git -C ctg show HEAD:docs/patches/opencode-v2.0.32-session-ui-combined-v3.patch > ctg/docs/patches/opencode-v2.0.32-session-ui.patch
          node release-generator/tools/generate-owned-runtime-release.mjs "$RELEASE_VERSION" candidate-assets "$GITHUB_WORKSPACE/ctg" > /dev/null
          node -e 'const fs=require("node:fs");const p="runtime-release.json.candidate";const m=JSON.parse(fs.readFileSync(p));if(m.releaseVersion!==process.env.RELEASE_VERSION)process.exit(1)'
          mkdir candidate-bundle
          cp candidate-assets/opencode-*.tar.gz candidate-assets/opencode-*.tar.gz.build.json "$GITHUB_WORKSPACE/runtime-release.json.candidate" candidate-bundle/
          (cd candidate-bundle && sha256sum opencode-*.tar.gz > runtime-archives-SHA256SUMS.txt)
          node -e 'const fs=require("node:fs");const meta={version:1,releaseVersion:process.env.RELEASE_VERSION,sourceCommit:process.env.SOURCE_COMMIT,workflowPath:".github/workflows/publish-owned-opencode-runtime.yml",runId:Number(process.env.RUN_ID)};fs.writeFileSync("candidate-bundle/candidate-provenance.json",JSON.stringify(meta,null,2)+"\n",{flag:"wx"})'
          sha256sum candidate-bundle/opencode-*.tar.gz candidate-bundle/runtime-release.json.candidate >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ctg-runtime-candidate-${{ needs.validate-request.outputs.release_version }}
          path: candidate-bundle/*
          if-no-files-found: error
          retention-days: 90

  publish-existing-draft:
    if: inputs.mode == 'publish'
    needs: validate-request
    runs-on: ubuntu-latest
    environment: ctg-runtime-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prebuild_run_id }}
          name: ctg-runtime-candidate-${{ needs.validate-request.outputs.release_version }}
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-request.outputs.release_commit }}
          path: ctg
      - uses: actions/checkout@v4
        with:
          repository: B-icy/Carthagent
          ref: e32bcf7d00645222a34be002f9f7da6626d8db9c
          path: release-generator
      - name: Verify pinned generator and final package trust root are present
        shell: bash
        run: |
          test "$(git -C release-generator rev-parse HEAD)" = e32bcf7d00645222a34be002f9f7da6626d8db9c
          test -f release-generator/tools/generate-owned-runtime-release.mjs
          test -f ctg/lib/opencode/runtime-release.json
      - name: Verify prebuild provenance, packaged trust root, and unchanged candidate bytes
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-request.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate-request.outputs.release_version }}
          PREBUILD_RUN_ID: ${{ inputs.prebuild_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREBUILD_RUN_ID")"
          [[ "$(jq -r .status <<<"$run")" == completed ]]
          [[ "$(jq -r .conclusion <<<"$run")" == success ]]
          [[ "$(jq -r .event <<<"$run")" == workflow_dispatch ]]
          [[ "$(jq -r .head_repository.full_name <<<"$run")" == "$GITHUB_REPOSITORY" ]]
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-owned-opencode-runtime.yml" --jq '.id')"
          [[ "$(jq -r .workflow_id <<<"$run")" == "$workflow_id" ]]
          prebuild_branch="$(jq -r .head_branch <<<"$run")"
          [[ "$prebuild_branch" =~ ^[A-Za-z0-9._/-]+$ ]]
          EXPECTED_SOURCE="$(jq -r .head_sha <<<"$run")"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          candidate_dir=candidate
          expected_files=(candidate-provenance.json runtime-archives-SHA256SUMS.txt runtime-release.json.candidate)
          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            expected_files+=("opencode-$key.tar.gz" "opencode-$key.tar.gz.build.json")
          done
          test -z "$(find "$candidate_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          mapfile -t actual_files < <(find "$candidate_dir" -maxdepth 1 -type f -exec basename {} \; | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_files[@]}" | sort)
          [[ "${actual_files[*]}" == "${expected_sorted[*]}" ]]
          test -f "$candidate_dir/candidate-provenance.json"
          test -f "$candidate_dir/runtime-archives-SHA256SUMS.txt"
          (cd "$candidate_dir" && sha256sum -c runtime-archives-SHA256SUMS.txt)
          PREBUILD_RUN_ID="$PREBUILD_RUN_ID" RELEASE_VERSION="$RELEASE_VERSION" EXPECTED_SOURCE="$EXPECTED_SOURCE" CANDIDATE_DIR="$candidate_dir" \
            node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.env.CANDIDATE_DIR+"/candidate-provenance.json"));if(m.version!==1||m.runId!==Number(process.env.PREBUILD_RUN_ID)||m.sourceCommit!==process.env.EXPECTED_SOURCE||m.releaseVersion!==process.env.RELEASE_VERSION||m.workflowPath!==".github/workflows/publish-owned-opencode-runtime.yml")process.exit(1)'
          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            test -f "$candidate_dir/opencode-$key.tar.gz"
            test -f "$candidate_dir/opencode-$key.tar.gz.build.json"
          done
          mkdir regenerated-assets
          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do cp "$candidate_dir/opencode-$key.tar.gz" "$candidate_dir/opencode-$key.tar.gz.build.json" regenerated-assets/; done
          # The pinned release generator still reads the historical patch path.
          # Resolve its input from the tagged recipe, never execute the recipe.
          patch_file="$(git -C ctg show HEAD:script/ctg/build-owned-runtime.sh | sed -n 's|^patch_file="\$ROOT/\(docs/patches/[^"[:space:]]*\.patch\)"$|\1|p')"
          [[ "$patch_file" =~ ^docs/patches/[A-Za-z0-9._-]+\.patch$ ]]
          git -C ctg show "HEAD:$patch_file" > ctg/docs/patches/opencode-v2.0.32-session-ui.patch
          node release-generator/tools/generate-owned-runtime-release.mjs "$RELEASE_VERSION" regenerated-assets "$GITHUB_WORKSPACE/ctg" > /dev/null
          cmp "$candidate_dir/runtime-release.json.candidate" "$GITHUB_WORKSPACE/runtime-release.json.candidate"
          (cd "$candidate_dir" && sha256sum --check runtime-archives-SHA256SUMS.txt)
          CANDIDATE_DIR="$candidate_dir" node -e 'const fs=require("node:fs");const assert=require("node:assert/strict");const actual=JSON.parse(fs.readFileSync(process.env.CANDIDATE_DIR+"/runtime-release.json.candidate"));const packaged=JSON.parse(fs.readFileSync("ctg/lib/opencode/runtime-release.json"));assert.deepStrictEqual(actual,packaged,"prebuild candidate differs from packaged runtime-release.json")'
          [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]]
          [[ "$(node -p 'require("./ctg/package.json").version')" == "$RELEASE_VERSION" ]]
          echo "candidate=verified" >> "$GITHUB_OUTPUT"
      - name: Recheck immutable draft target and upload verified bytes without clobbering
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-request.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_commit="$(jq -r '.object.sha' <<<"$ref")"
          if [[ "$(jq -r '.object.type' <<<"$ref")" == tag ]]; then tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_commit" --jq '.object.sha')"; fi
          test "$tag_commit" = "${{ needs.validate-request.outputs.release_commit }}"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == true' | grep -qx true
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join("\n")')"
          if grep -Eq '^(runtime-release\.json|runtime-release-SHA256SUMS\.txt|opencode-(linux-x64|linux-arm64|darwin-x64|darwin-arm64|windows-x64)\.tar\.gz)$' <<<"$assets"; then
            echo "Refusing to overwrite existing owned runtime release assets" >&2
            exit 1
          fi
          cp candidate/runtime-release.json.candidate candidate/runtime-release.json
          (cd candidate && sha256sum opencode-*.tar.gz runtime-release.json > runtime-release-SHA256SUMS.txt)
          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do gh release upload "$RELEASE_TAG" "candidate/opencode-$key.tar.gz#opencode-$key.tar.gz" --repo "$GITHUB_REPOSITORY"; done
          gh release upload "$RELEASE_TAG" candidate/runtime-release.json#runtime-release.json --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" candidate/runtime-release-SHA256SUMS.txt#runtime-release-SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
