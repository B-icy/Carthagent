name: Diagnose beta8 macOS runtime startup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: ctg
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 574b4ca12f7875eec4aaf80ef40df23df323db1d
          path: release
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: release
      - name: Trace exact runtime startup and host-to-quest sequence
        working-directory: release
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
          CARTHAGENT_NO_UPDATE_CHECK: '1'
        run: node ../ctg/tools/diagnose-beta8-startup.mjs
