name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag that has passed package acceptance and has runtime assets
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      tested_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node tools/verify-release-version.mjs "$RELEASE_TAG"
      - run: npm ci
      - run: npm run quality
      - name: Accept the installed package with its owned runtime required
        env:
          CTG_REQUIRE_OWNED_RUNTIME: '1'
          # This published-release gate must exercise the public anonymous path.
          CTG_RUNTIME_GITHUB_TOKEN: ''
        run: npm run test:native-package
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify tag still points to the tested commit
        env:
          EXPECTED_SHA: ${{ needs.verify-release.outputs.tested_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$tag_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Release tag ${RELEASE_TAG} resolves to ${tag_sha}, not tested commit ${EXPECTED_SHA}." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dist_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then
            dist_tag=next
          fi
          if npm view "carthagent@${version}" version --json >/dev/null 2>&1; then
            echo "::notice::carthagent@${version} is already published; skipping."
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Set the NPM_TOKEN repository secret to publish Carthagent to npm." >&2
            exit 1
          fi
          npm publish --provenance --access public --tag "$dist_tag"

  publish-release-manifest:
    if: ${{ !contains(inputs.release_tag, '-') }}
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify tag still points to the tested commit
        env:
          EXPECTED_SHA: ${{ needs.verify-release.outputs.tested_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$tag_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Release tag ${RELEASE_TAG} resolves to ${tag_sha}, not tested commit ${EXPECTED_SHA}." >&2
            exit 1
          fi
      # Sequence: build runtime assets from the source revision pinned in the
      # trusted manifest; verify the final package and acceptance gates; create
      # the GitHub release with those archives; publish only after final review.
      - name: Require the completed GitHub release and runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          if [ "$(jq -r '.isDraft' <<<"$release")" != false ]; then
            echo "::error::Publish the GitHub release with its runtime assets before publishing the control-plane manifest." >&2
            exit 1
          fi
          for asset in \
            opencode-linux-x64.tar.gz \
            opencode-linux-arm64.tar.gz \
            opencode-darwin-x64.tar.gz \
            opencode-darwin-arm64.tar.gz \
            opencode-windows-x64.tar.gz; do
            if ! jq -e --arg name "$asset" '.assets | any(.name == $name)' <<<"$release" >/dev/null; then
              echo "::error::Missing required runtime archive ${asset}." >&2
              exit 1
            fi
          done
      - name: Verify runtime archives against the packaged immutable manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          # Do not let a runner-level draft credential weaken published asset verification.
          CTG_RUNTIME_GITHUB_TOKEN: ''
        run: node tools/verify-owned-runtime-release.mjs "${RELEASE_TAG#v}" lib/opencode/runtime-release.json "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
      - name: Publish the CLI release manifest to the control plane
        env:
          CARTHAGENT_CLI_RELEASE_TOKEN: ${{ secrets.CARTHAGENT_CLI_RELEASE_TOKEN }}
          CARTHAGENT_CLOUD_URL: ${{ vars.CARTHAGENT_CLOUD_URL || 'https://api.carthagent.xyz' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-release.outputs.tested_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${CARTHAGENT_CLI_RELEASE_TOKEN:-}" ]; then
            echo "::error::Set the CARTHAGENT_CLI_RELEASE_TOKEN repository secret to the backend's CARTHAGENT_CLI_RELEASE_ADMIN_TOKEN value." >&2
            exit 1
          fi

          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          tag_type="$(jq -r '.object.type' <<<"$tag_ref")"
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref")"
          depth=0
          while [ "$tag_type" = tag ]; do
            depth=$((depth + 1))
            if [ "$depth" -gt 5 ]; then
              echo "::error::Release tag ${RELEASE_TAG} has excessive nested tag objects." >&2
              exit 1
            fi
            tag_object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
            tag_type="$(jq -r '.object.type' <<<"$tag_object_json")"
            tag_object="$(jq -r '.object.sha' <<<"$tag_object_json")"
          done
          if [ "$tag_object" != "$EXPECTED_SHA" ]; then
            echo "::error::Remote release tag ${RELEASE_TAG} resolves to ${tag_object}, not the tested commit ${EXPECTED_SHA}." >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          curl -fsS -X POST "${CARTHAGENT_CLOUD_URL}/v1/cli/releases" \
            -H "authorization: Bearer ${CARTHAGENT_CLI_RELEASE_TOKEN}" \
            -H 'content-type: application/json' \
            -d "{\"version\":\"${version}\"}"
