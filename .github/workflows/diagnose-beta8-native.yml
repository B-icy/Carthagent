name: Diagnose beta8 native input
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: ctg
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: 843a6c514e606b436a7fe713422ace0a93ad3d61
          path: native
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Prepare exact candidate and trace-only test
        shell: bash
        run: |
          set -euo pipefail
          git -C native -c core.autocrlf=false checkout-index --force -- bun.lock
          git -C native apply ../ctg/docs/patches/opencode-v2.0.32-session-ui-combined-v11.patch
          cd native
          bun install --frozen-lockfile
          node ../ctg/tools/diagnose-beta8-mouse.mjs
      - name: Verify missing-folder fixture
        shell: bash
        working-directory: native
        run: bun test --cwd packages/tui --timeout 60000 test/sidebar/new-session-preflight.test.tsx --rerun-each 10
      - name: Trace navigation stress
        if: runner.os == 'macOS'
        shell: bash
        working-directory: native
        run: bun test --cwd packages/tui --timeout 60000 test/navigation-rail.test.tsx --rerun-each 30
