name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # GitHub requires push access to read draft release assets. The runtime
    # transport uses this token only for allowlisted GitHub API GETs; hashes
    # remain pinned by the committed release manifest. Never publish the draft
    # merely to make PR acceptance pass.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:native-host
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
      - run: node tools/test-native-daily-quests.mjs
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:native-controls
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:native-outcomes
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
      - if: runner.os != 'Windows'
        run: npm run test:native-pty
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
      - run: python -m pip install Pillow==11.3.0
      - run: npm run test:python

  native-package:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:native-package
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:browser   # bundled chrome-headless-shell; no browser setup needed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: ignore
