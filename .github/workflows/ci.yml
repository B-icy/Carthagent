name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The passive release check doubles as the anonymous install ping; CI runners
# must not register as installs.
env:
  CARTHAGENT_NO_UPDATE_CHECK: '1'

jobs:
  test:
    # GitHub requires push access to read draft release assets. The runtime
    # transport uses this token only for allowlisted GitHub API GETs; hashes
    # remain pinned by the committed release manifest. Never publish the draft
    # merely to make PR acceptance pass.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/ctg
          key: build-cache-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'plugins/carthagent/tsconfig.json') }}-${{ github.sha }}
          restore-keys: build-cache-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'plugins/carthagent/tsconfig.json') }}-
      - run: npm run lint
      - run: npm run build
      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == 24) }}
        run: npm run test:ci
      - name: Test with coverage thresholds
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
        run: npm run test:coverage
      - name: Test timing report
        if: always()
        run: node tools/test-report.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            artifacts/test-results/
            artifacts/test-timings.json
          if-no-files-found: ignore
      - run: npm run test:native-host
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
      - run: node tools/test-native-daily-quests.mjs
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:native-controls
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:native-outcomes
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
      - if: runner.os != 'Windows'
        run: npm run test:native-pty
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
      - run: python -m pip install Pillow==11.3.0
      - run: npm run test:python

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # File sizes, debt markers, duplication, unused dependencies, workspace
      # version drift, feature-flag lifecycle, generated API docs, AGENTS.md.
      - run: npm run check:repo
      - run: node tools/validate-agents-md.mjs --links-only "docs/*.md" "docs/api/*.md"
      # Cold timings (no build cache) stay comparable with tools/build-budget.json.
      - run: npm run build:timings
      - run: npm run qa:smoke -- --json artifacts/qa-smoke/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repo-checks
          path: |
            artifacts/build-timings.json
            artifacts/qa-smoke/
          if-no-files-found: ignore

  native-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm ci --ignore-scripts
      - run: npm run test:native-navigation -- --rerun-each 10

  native-package:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:native-package
        env:
          CTG_RUNTIME_GITHUB_TOKEN: ${{ github.token }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:browser   # bundled chrome-headless-shell; no browser setup needed
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: ignore
