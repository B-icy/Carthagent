<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>*{box-sizing:border-box}body{margin:auto;padding:12px;max-width:1000px}input,select{max-width:100%}label{display:block}article{padding:8px}button{padding:8px}</style></head><body><h1>Evaluator fixture store</h1><label>Search<input data-testid="search"></label><label>Category<select data-testid="category"><option value="">All</option><option>accessories</option></select></label><label>Sort<select data-testid="sort"><option value="price-asc">Price</option><option value="name">Name</option></select></label><div data-testid="products"></div><div data-testid="cart"></div><label>Coupon<input data-testid="coupon"></label><div data-testid="total"></div><label>Name<input data-testid="customer-name"></label><label>Email<input data-testid="customer-email"></label><label>Address<input data-testid="customer-address"></label><button data-testid="checkout">Checkout</button><div data-testid="status" aria-live="polite"></div><script>
const e=id=>document.querySelector('[data-testid="'+id+'"]');let items=JSON.parse(localStorage.getItem('cart')||'[]');
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});return r.json();}
async function products(){const r=await request('/api/products?'+new URLSearchParams({q:e('search').value,category:e('category').value,sort:e('sort').value}));e('products').innerHTML=r.products.map(p=>'<article>'+p.name+' <button data-testid="add-'+p.id+'" '+(!p.stock?'disabled':'')+'>Add</button></article>').join('');for(const p of r.products)e('add-'+p.id).onclick=()=>{const i=items.find(i=>i.id===p.id);if(i)i.quantity++;else items.push({id:p.id,quantity:1});cart();};}
async function total(){if(!items.length){e('total').textContent='$0.00';return;}const q=await request('/api/quote',{items,coupon:e('coupon').value});e('total').textContent=q.error||'$'+(q.totalCents/100).toFixed(2);}
function cart(){localStorage.setItem('cart',JSON.stringify(items));e('cart').innerHTML=items.map(i=>'<label>'+i.id+'<input type="number" data-testid="qty-'+i.id+'" value="'+i.quantity+'"></label><button data-testid="remove-'+i.id+'">Remove</button>').join('');for(const i of items){e('qty-'+i.id).onchange=()=>{i.quantity=Number(e('qty-'+i.id).value);localStorage.setItem('cart',JSON.stringify(items));total();};e('remove-'+i.id).onclick=()=>{items=items.filter(x=>x!==i);cart();};}total();}
for(const id of ['search','category','sort'])e(id).oninput=products;e('coupon').oninput=total;e('checkout').onclick=async()=>{const r=await request('/api/orders',{items,coupon:e('coupon').value,key:crypto.randomUUID(),customer:{name:e('customer-name').value,email:e('customer-email').value,address:e('customer-address').value}});e('status').textContent=r.error||'Order confirmed '+r.order.id;};products();cart();
</script></body></html>
